name: Observe YouTube Hybrid

on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL
        required: true
        type: string
      preset:
        description: Analysis preset
        required: true
        default: motion
        type: choice
        options: [motion, standard]
      max_height:
        description: Maximum streamed source height
        required: true
        default: '720'
        type: choice
        options: ['720', '480', '360']
  push:
    branches: [main]
    paths:
      - 'requests/current.json'

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    outputs:
      video_id: ${{ steps.capture.outputs.video_id }}
      title: ${{ steps.capture.outputs.title }}
      ext: ${{ steps.capture.outputs.ext }}
      remote_path: ${{ steps.capture.outputs.remote_path }}
      source_url: ${{ steps.capture.outputs.source_url }}
      preset: ${{ steps.request.outputs.preset }}
    steps:
      - uses: actions/checkout@v4

      - name: Install portable capture tools
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "youtube-observation-tools"
          if (Test-Path $toolDir) { Remove-Item $toolDir -Recurse -Force }
          New-Item -ItemType Directory -Path $toolDir | Out-Null

          $yt = Join-Path $toolDir "yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile $yt

          $zip = Join-Path $toolDir "rclone.zip"
          $rcloneExtract = Join-Path $toolDir "rclone"
          Invoke-WebRequest -Uri "https://downloads.rclone.org/rclone-current-windows-amd64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $rcloneExtract -Force

          $rclone = Get-ChildItem $rcloneExtract -Filter rclone.exe -Recurse | Select-Object -First 1
          if (-not $rclone) { throw "rclone.exe not found after extraction" }

          "YT_DLP_EXE=$yt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RCLONE_EXE=$($rclone.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve request
        id: request
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $url = "${{ inputs.url }}"
            $preset = "${{ inputs.preset }}"
            $height = "${{ inputs.max_height }}"
          } else {
            $r = Get-Content requests/current.json -Raw | ConvertFrom-Json
            $url = [string]$r.url
            $preset = [string]$r.preset
            if (-not $preset) { $preset = "motion" }
            $height = [string]$r.max_height
            if (-not $height -or $height -eq "1080") { $height = "720" }
          }
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preset=$preset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "height=$height" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore capture credentials
        shell: powershell
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if (-not $env:YOUTUBE_COOKIES_B64) { throw "YOUTUBE_COOKIES_B64 secret is missing" }
          if (-not $env:RCLONE_CONFIG_B64) { throw "RCLONE_CONFIG_B64 secret is missing" }

          $cookiePath = Join-Path $env:RUNNER_TEMP "youtube_cookies.txt"
          $rclonePath = Join-Path $env:RUNNER_TEMP "rclone.conf"

          [System.IO.File]::WriteAllBytes(
            $cookiePath,
            [Convert]::FromBase64String($env:YOUTUBE_COOKIES_B64)
          )
          [System.IO.File]::WriteAllBytes(
            $rclonePath,
            [Convert]::FromBase64String($env:RCLONE_CONFIG_B64)
          )

          "YOUTUBE_COOKIE_FILE=$cookiePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RCLONE_CONFIG=$rclonePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify capture tools
        shell: powershell
        run: |
          & $env:YT_DLP_EXE --version
          & $env:RCLONE_EXE version | Select-Object -First 1
          & $env:RCLONE_EXE lsf youtube-drive: --max-depth 1 | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Google Drive remote verification failed" }
      - name: Stream YouTube directly to Google Drive
        id: capture
        shell: powershell
        run: |
          $url = "${{ steps.request.outputs.url }}"
          $height = "${{ steps.request.outputs.height }}"
          $format = "bv*[height<=$height]/b[height<=$height]/best"

          $attempts = @(
            @{ Name = 'cookies-default'; Cookies = $true; Client = $null },
            @{ Name = 'cookies-web-safari'; Cookies = $true; Client = 'web_safari' },
            @{ Name = 'cookies-web-embedded'; Cookies = $true; Client = 'web_embedded' },
            @{ Name = 'anonymous-default'; Cookies = $false; Client = $null },
            @{ Name = 'anonymous-web-safari'; Cookies = $false; Client = 'web_safari' },
            @{ Name = 'anonymous-web-embedded'; Cookies = $false; Client = 'web_embedded' },
            @{ Name = 'anonymous-android-vr'; Cookies = $false; Client = 'android_vr' }
          )

          $meta = $null
          $chosen = $null

          foreach ($a in $attempts) {
            Write-Host ('Metadata attempt: ' + $a.Name)
            $args = @('--no-warnings')
            if ($a.Cookies) { $args += @('--cookies', $env:YOUTUBE_COOKIE_FILE) }
            if ($a.Client) { $args += @('--extractor-args', ('youtube:player_client=' + $a.Client)) }
            $args += @('--dump-single-json', '--skip-download', '--ignore-no-formats-error', $url)

            $metaJson = & $env:YT_DLP_EXE @args
            if ($LASTEXITCODE -eq 0 -and $metaJson) {
              try {
                $meta = ($metaJson -join [Environment]::NewLine) | ConvertFrom-Json
                $chosen = $a
                break
              } catch {
                Write-Host ('JSON parse failed for ' + $a.Name)
              }
            }
          }

          if (-not $meta -or -not $chosen) { throw 'All yt-dlp metadata strategies failed' }

          $videoId = [string]$meta.id
          $title = [string]$meta.title
          $ext = [string]$meta.ext
          if (-not $ext) { $ext = 'mp4' }

          $safeTitle = $title -replace '[<>:"/\\|?*]', '_'
          $safeTitle = ($safeTitle -replace '\s+', ' ').Trim().TrimEnd('.')
          if ($safeTitle.Length -gt 100) { $safeTitle = $safeTitle.Substring(0,100).Trim() }
          if (-not $safeTitle) { $safeTitle = $videoId }
          $remotePath = "$videoId - $safeTitle.$ext"

          $uploaded = $false
          $downloadStrategy = $null

          foreach ($a in $attempts) {
            Write-Host ('Download attempt: ' + $a.Name)

            $oldEap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $env:RCLONE_EXE deletefile ("youtube-drive:" + $remotePath) *> $null
            $ErrorActionPreference = $oldEap
            $global:LASTEXITCODE = 0

            $ytArgs = @('--no-warnings')
            if ($a.Cookies) { $ytArgs += @('--cookies', $env:YOUTUBE_COOKIE_FILE) }
            if ($a.Client) { $ytArgs += @('--extractor-args', ('youtube:player_client=' + $a.Client)) }
            $ytArgs += @('-f', $format, '-o', '-', $url)

            $quoted = @()
            foreach ($arg in $ytArgs) {
              $escaped = $arg -replace '"', '""'
              $quoted += ('"' + $escaped + '"')
            }

            $ytCommand = ('"' + $env:YT_DLP_EXE + '" ' + ($quoted -join ' '))
            $rcCommand = ('"' + $env:RCLONE_EXE + '" rcat "youtube-drive:' + $remotePath + '" --stats 15s --stats-one-line --drive-chunk-size 32M')
            $cmdFile = Join-Path $env:RUNNER_TEMP ('stream-youtube-' + $a.Name + '.cmd')
            $line = $ytCommand + ' | ' + $rcCommand
            [System.IO.File]::WriteAllText($cmdFile, "@echo off`r`n$line`r`nexit /b %ERRORLEVEL%`r`n")

            & cmd.exe /d /c $cmdFile

            $sizeCmd = ('"' + $env:RCLONE_EXE + '" size "youtube-drive:' + $remotePath + '" --json 2>nul')
            $sizeJson = & cmd.exe /d /c $sizeCmd
            $sizeExit = $LASTEXITCODE
            if ($sizeExit -eq 0 -and $sizeJson) {
              try {
                $size = $sizeJson | ConvertFrom-Json
                if ($size -and [int64]$size.bytes -gt 0) {
                  $uploaded = $true
                  $downloadStrategy = $a.Name
                  break
                }
              } catch {}
            }

            Write-Host ('Download attempt produced no usable object: ' + $a.Name)
          }

          if (-not $uploaded) {
            $oldEap = $ErrorActionPreference
            $ErrorActionPreference = 'Continue'
            & $env:RCLONE_EXE deletefile ("youtube-drive:" + $remotePath) *> $null
            $ErrorActionPreference = $oldEap
            $global:LASTEXITCODE = 0
            throw 'All YouTube download strategies failed or produced empty files'
          }

          Write-Host ('Successful download strategy: ' + $downloadStrategy)
          Write-Host ('Persistent source: youtube-drive:' + $remotePath)

          "video_id=$videoId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ext=$ext" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "remote_path=$remotePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Remove temporary capture credentials
        if: always()
        shell: powershell
        run: |
          if ($env:YOUTUBE_COOKIE_FILE) {
            Remove-Item $env:YOUTUBE_COOKIE_FILE -Force -ErrorAction SilentlyContinue
          }
          if ($env:RCLONE_CONFIG) {
            Remove-Item $env:RCLONE_CONFIG -Force -ErrorAction SilentlyContinue
          }

  process:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install processing tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python3 --version
          ffmpeg -version | head -n1
          rclone version | head -n1

      - name: Restore Google Drive config
        shell: bash
        env:
          RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          test -n "$RCLONE_CONFIG_B64"
          mkdir -p "$HOME/.config/rclone"
          printf '%s' "$RCLONE_CONFIG_B64" | base64 --decode > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"
          rclone lsf youtube-drive: --max-depth 1 >/dev/null

      - name: Download persistent source from Drive
        shell: bash
        run: |
          mkdir -p source
          rclone copyto             "youtube-drive:${{ needs.capture.outputs.remote_path }}"             "source/source.${{ needs.capture.outputs.ext }}"             --stats 15s --stats-one-line

      - name: Build observation pack
        shell: bash
        run: |
          REQ_ARG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && -f requests/current.json ]]; then
            REQ_ARG="--request-json requests/current.json"
          fi

          python3 scripts/process_file.py             "source/source.${{ needs.capture.outputs.ext }}"             --output observation_output             --preset "${{ needs.capture.outputs.preset }}"             --source-url "${{ needs.capture.outputs.source_url }}"             --remote-path "${{ needs.capture.outputs.remote_path }}"             --title "${{ needs.capture.outputs.title }}"             --video-id "${{ needs.capture.outputs.video_id }}"             $REQ_ARG

          cp ANALYSIS_PROTOCOL.md observation_output/metadata/ANALYSIS_PROTOCOL.md

      - name: Upload observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-observation-${{ needs.capture.outputs.video_id }}-${{ github.run_id }}
          path: observation_output/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
