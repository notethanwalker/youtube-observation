name: Observe YouTube Hybrid

on:
  workflow_dispatch:
    inputs:
      url:
        description: YouTube URL
        required: true
        type: string
      preset:
        description: Analysis preset
        required: true
        default: motion
        type: choice
        options: [motion, standard]
      max_height:
        description: Maximum streamed source height
        required: true
        default: '720'
        type: choice
        options: ['720', '480', '360']
  push:
    branches: [main]
    paths:
      - 'requests/current.json'

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    outputs:
      video_id: ${{ steps.capture.outputs.video_id }}
      title: ${{ steps.capture.outputs.title }}
      ext: ${{ steps.capture.outputs.ext }}
      remote_path: ${{ steps.capture.outputs.remote_path }}
      source_url: ${{ steps.capture.outputs.source_url }}
      preset: ${{ steps.request.outputs.preset }}
    steps:
      - uses: actions/checkout@v4

      - name: Install portable capture tools
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "youtube-observation-tools"
          if (Test-Path $toolDir) { Remove-Item $toolDir -Recurse -Force }
          New-Item -ItemType Directory -Path $toolDir | Out-Null

          $yt = Join-Path $toolDir "yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile $yt

          "YT_DLP_EXE=$yt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Resolve request
        id: request
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $url = "${{ inputs.url }}"
            $preset = "${{ inputs.preset }}"
            $height = "${{ inputs.max_height }}"
          } else {
            $r = Get-Content requests/current.json -Raw | ConvertFrom-Json
            $url = [string]$r.url
            $preset = [string]$r.preset
            if (-not $preset) { $preset = "motion" }
            $height = [string]$r.max_height
            if (-not $height -or $height -eq "1080") { $height = "720" }
          }
          $url = $url.Trim()
          $preset = $preset.Trim().ToLowerInvariant()
          $height = $height.Trim()

          if (-not ($url -match '^https?://(www\.)?(youtube\.com|youtu\.be)/')) {
            throw "Request does not contain a supported YouTube URL"
          }
          if ($preset -notin @('motion', 'standard')) {
            throw "Invalid preset: $preset"
          }
          if ($height -notin @('360', '480', '720')) {
            throw "Invalid height: $height"
          }

          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "preset=$preset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "height=$height" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore optional YouTube cookies
        shell: powershell
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if ($env:YOUTUBE_COOKIES_B64) {
            $cookiePath = Join-Path $env:RUNNER_TEMP "youtube_cookies.txt"
            [System.IO.File]::WriteAllBytes(
              $cookiePath,
              [Convert]::FromBase64String($env:YOUTUBE_COOKIES_B64)
            )
            "YOUTUBE_COOKIE_FILE=$cookiePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            Write-Host "YouTube cookies restored."
          } else {
            Write-Host "No YouTube cookies configured; anonymous strategies remain available."
          }

      - name: Verify capture tools
        shell: powershell
        run: |
          & $env:YT_DLP_EXE --version
          if ($LASTEXITCODE -ne 0) { throw "yt-dlp verification failed" }
      - name: Download YouTube to temporary source
        id: capture
        shell: powershell
        run: |
          $url = "${{ steps.request.outputs.url }}"
          $height = "${{ steps.request.outputs.height }}"
          $format = "bv*[height<=$height]/b[height<=$height]/best"

          $attempts = @(
            @{ Name = 'cookies-default'; Cookies = $true; Client = $null },
            @{ Name = 'cookies-web-safari'; Cookies = $true; Client = 'web_safari' },
            @{ Name = 'cookies-web-embedded'; Cookies = $true; Client = 'web_embedded' },
            @{ Name = 'anonymous-default'; Cookies = $false; Client = $null },
            @{ Name = 'anonymous-web-safari'; Cookies = $false; Client = 'web_safari' },
            @{ Name = 'anonymous-web-embedded'; Cookies = $false; Client = 'web_embedded' },
            @{ Name = 'anonymous-android-vr'; Cookies = $false; Client = 'android_vr' }
          )

          $meta = $null
          foreach ($a in $attempts) {
            Write-Host ('Metadata attempt: ' + $a.Name)
            $args = @('--no-warnings')
            if ($a.Cookies) { $args += @('--cookies', $env:YOUTUBE_COOKIE_FILE) }
            if ($a.Client) { $args += @('--extractor-args', ('youtube:player_client=' + $a.Client)) }
            $args += @('--dump-single-json', '--skip-download', '--ignore-no-formats-error', $url)
            $metaJson = & $env:YT_DLP_EXE @args
            if ($LASTEXITCODE -eq 0 -and $metaJson) {
              try {
                $meta = ($metaJson -join [Environment]::NewLine) | ConvertFrom-Json
                break
              } catch {}
            }
          }
          if (-not $meta) { throw 'All yt-dlp metadata strategies failed' }

          $videoId = [string]$meta.id
          $title = [string]$meta.title
          $ext = 'mp4'
          $sourcePath = Join-Path $env:RUNNER_TEMP ("youtube-observation-source-" + $videoId + ".mp4")
          if (Test-Path $sourcePath) { Remove-Item $sourcePath -Force }

          $downloaded = $false
          $downloadStrategy = $null
          foreach ($a in $attempts) {
            Write-Host ('Download attempt: ' + $a.Name)
            if (Test-Path $sourcePath) { Remove-Item $sourcePath -Force }

            $ytArgs = @('--no-warnings')
            if ($a.Cookies) { $ytArgs += @('--cookies', $env:YOUTUBE_COOKIE_FILE) }
            if ($a.Client) { $ytArgs += @('--extractor-args', ('youtube:player_client=' + $a.Client)) }
            $ytArgs += @('-f', $format, '--merge-output-format', 'mp4', '-o', $sourcePath, $url)

            & $env:YT_DLP_EXE @ytArgs
            if ($LASTEXITCODE -eq 0 -and (Test-Path $sourcePath)) {
              $len = (Get-Item $sourcePath).Length
              if ($len -gt 0) {
                $downloaded = $true
                $downloadStrategy = $a.Name
                break
              }
            }
          }

          if (-not $downloaded) { throw 'All YouTube download strategies failed' }

          Write-Host ('Successful download strategy: ' + $downloadStrategy)
          Write-Host ('Temporary source: ' + $sourcePath)

          "SOURCE_FILE=$sourcePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "video_id=$videoId" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "title=$title" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "ext=$ext" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "remote_path=" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "source_url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload temporary source artifact
        uses: actions/upload-artifact@v4
        with:
          name: raw-source-${{ steps.capture.outputs.video_id }}-${{ github.run_id }}
          path: ${{ env.SOURCE_FILE }}
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

      - name: Remove temporary capture credentials
        if: always()
        shell: powershell
        run: |
          if ($env:YOUTUBE_COOKIE_FILE) {
            Remove-Item $env:YOUTUBE_COOKIE_FILE -Force -ErrorAction SilentlyContinue
          }
          if ($env:SOURCE_FILE) {
            Remove-Item $env:SOURCE_FILE -Force -ErrorAction SilentlyContinue
          }

  process:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install processing tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg rclone
          python3 --version
          ffmpeg -version | head -n1
          rclone version | head -n1

      - name: Download temporary source artifact
        uses: actions/download-artifact@v4
        with:
          name: raw-source-${{ needs.capture.outputs.video_id }}-${{ github.run_id }}
          path: source

      - name: Normalize source filename
        shell: bash
        run: |
          src="$(find source -type f | head -n1)"
          test -n "$src"
          mv "$src" "source/source.${{ needs.capture.outputs.ext }}"

      - name: Build observation pack
        shell: bash
        run: |
          REQ_ARG=""
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && -f requests/current.json ]]; then
            REQ_ARG="--request-json requests/current.json"
          fi

          python3 scripts/process_file.py             "source/source.${{ needs.capture.outputs.ext }}"             --output observation_output             --preset "${{ needs.capture.outputs.preset }}"             --source-url "${{ needs.capture.outputs.source_url }}"             --remote-path "${{ needs.capture.outputs.remote_path }}"             --title "${{ needs.capture.outputs.title }}"             --video-id "${{ needs.capture.outputs.video_id }}"             $REQ_ARG

          cp ANALYSIS_PROTOCOL.md observation_output/metadata/ANALYSIS_PROTOCOL.md

      - name: Upload observation artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-observation-${{ needs.capture.outputs.video_id }}-${{ github.run_id }}
          path: observation_output/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
