name: Transcribe V1.2 Review
on:
  push:
    branches: [main]
    paths: ['requests/transcribe-v12.txt']
permissions:
  contents: read
jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install tools
        run: |
          python3 -m pip install -q selenium faster-whisper
      - name: Download and transcribe
        run: |
          python3 - <<'PY'
          import json,time,requests
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          opts=webdriver.ChromeOptions(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1440,1200')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL'})
          d=webdriver.Chrome(options=opts)
          signed=None
          try:
            d.get('https://firestorage.ai/ja/f/7rfLgOWlCDLS')
            b=WebDriverWait(d,25).until(EC.presence_of_element_located((By.XPATH,"//button[contains(., 'ダウンロード') or contains(., 'Download')]")))
            d.execute_script("arguments[0].scrollIntoView({block:'center'}); arguments[0].click();",b)
            time.sleep(8)
            for entry in d.get_log('performance'):
              msg=json.loads(entry['message'])['message']
              if msg['method']!='Network.requestWillBeSent': continue
              u=msg['params']['request']['url']
              if 'wasabisys.com' in u and '01a0a2f9c3ec71db9aefea5494513cf3' in u:
                signed=u; break
          finally: d.quit()
          if not signed: raise RuntimeError('No signed audio URL found')
          r=requests.get(signed,timeout=60); r.raise_for_status(); open('/tmp/v12.mp3','wb').write(r.content)
          from faster_whisper import WhisperModel
          model=WhisperModel('small.en', device='cpu', compute_type='int8')
          segments, info=model.transcribe('/tmp/v12.mp3', beam_size=5, vad_filter=True)
          lines=[]
          for s in segments:
            line=f'[{s.start:07.2f}-{s.end:07.2f}] {s.text.strip()}'
            lines.append(line); print(line, flush=True)
          open('/tmp/transcript.txt','w').write('\n'.join(lines))
          PY
