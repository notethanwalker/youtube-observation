name: Capitology Pass 6 Selective Clips

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capitology-pass6-batch.yml'
      - 'scripts/capitology_pass6_capture.ps1'
      - 'requests/capitology-pass6-batch.json'

permissions:
  contents: read

jobs:
  capture:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Capture queued windows
        shell: powershell
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: .\scripts\capitology_pass6_capture.ps1 -RequestPath requests/capitology-pass6-batch.json -OutputPath pass06_output
      - name: Upload clips and check frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitology-pass6-clips-${{ github.run_id }}
          path: |
            pass06_output/manifest.json
            pass06_output/clips/
            pass06_output/frames/
          retention-days: 2
          if-no-files-found: warn
          compression-level: 0
