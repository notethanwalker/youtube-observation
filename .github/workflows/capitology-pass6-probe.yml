name: Capitology Pass 6 Media Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capitology-pass6-probe.yml'
      - 'requests/capitology-pass6-probe.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Resolve bounded request
        id: request
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          p = json.loads(Path('requests/capitology-pass6-probe.json').read_text())
          assert re.fullmatch(r'[A-Za-z0-9_-]{11}', p['video_id'])
          assert isinstance(p['start_seconds'], int) and p['start_seconds'] >= 0
          assert isinstance(p['duration_seconds'], int) and 1 <= p['duration_seconds'] <= 30
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"video_id={p['video_id']}\n")
              f.write(f"start={p['start_seconds']}\n")
              f.write(f"end={p['start_seconds'] + p['duration_seconds']}\n")
          PY
      - name: Install current downloader
        run: |
          python3 -m pip install --quiet --upgrade 'yt-dlp[default]'
          ffmpeg -version | head -n 1
          yt-dlp --version
      - name: Retrieve short section and frames
        id: media
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          VIDEO_ID: ${{ steps.request.outputs.video_id }}
          START: ${{ steps.request.outputs.start }}
          END: ${{ steps.request.outputs.end }}
        run: |
          mkdir -p probe_output/frames
          COOKIE_ARGS=()
          if [ -n "$YOUTUBE_COOKIES_B64" ]; then
            printf '%s' "$YOUTUBE_COOKIES_B64" | base64 --decode > "$RUNNER_TEMP/youtube_cookies.txt"
            chmod 600 "$RUNNER_TEMP/youtube_cookies.txt"
            COOKIE_ARGS=(--cookies "$RUNNER_TEMP/youtube_cookies.txt")
          fi
          ok=0
          for client in default web_safari android_vr; do
            echo "Trying client: $client" | tee -a probe_output/attempts.txt
            EXTRA=()
            if [ "$client" != default ]; then EXTRA=(--extractor-args "youtube:player_client=$client"); fi
            if yt-dlp --no-playlist --no-progress --no-warnings \
              "${COOKIE_ARGS[@]}" "${EXTRA[@]}" \
              -f 'bv*[height<=480]/b[height<=480]/best[height<=480]' \
              --download-sections "*$START-$END" --merge-output-format mp4 --force-overwrites \
              -o probe_output/section.mp4 \
              "https://www.youtube.com/watch?v=$VIDEO_ID" \
              > probe_output/last_attempt.log 2>&1; then
              if ffprobe -v error -show_entries format=duration -of csv=p=0 probe_output/section.mp4 > probe_output/duration.txt; then
                ok=1
                break
              fi
            fi
            tail -n 8 probe_output/last_attempt.log | sed -E 's@https://[^ ]+@[media URL omitted]@g' >> probe_output/attempts.txt
          done
          : > probe_output/last_attempt.log
          if [ "$ok" != 1 ]; then
            echo 'All section retrieval attempts failed.' | tee -a probe_output/attempts.txt
            exit 1
          fi
          ffmpeg -hide_banner -loglevel error -y -i probe_output/section.mp4 \
            -vf 'fps=1/3,scale=960:-2' -q:v 3 probe_output/frames/frame_%03d.jpg
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          d={'video_id':os.environ['VIDEO_ID'],'source_start_seconds':int(os.environ['START']),
             'source_end_seconds':int(os.environ['END']),
             'clip_duration_seconds':float(Path('probe_output/duration.txt').read_text().strip()),
             'frame_sampling':'one image every three seconds from section'}
          Path('probe_output/manifest.json').write_text(json.dumps(d,indent=2)+'\n')
          PY
          echo "Playable section and $(find probe_output/frames -name '*.jpg' | wc -l) frames retrieved."
      - name: Upload probe result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitology-pass6-probe-${{ github.run_id }}
          path: probe_output/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
