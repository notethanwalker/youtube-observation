name: Observe Google Drive Frames

on:
  push:
    branches: [main]
    paths:
      - 'requests/drive-frames.json'

permissions:
  contents: read

jobs:
  frames:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python3 -m pip install --upgrade gdown

      - name: Resolve request
        id: req
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          req = json.loads(Path("requests/drive-frames.json").read_text())
          url = str(req["url"]).strip()
          m = re.search(r'/file/d/([^/]+)', url)
          if not m:
              raise SystemExit("Could not extract Drive file ID")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"id={m.group(1)}\n")
              f.write(f"url={url}\n")
          Path("resolved_request.json").write_text(json.dumps(req, indent=2))
          PY

      - name: Download source
        shell: bash
        run: |
          mkdir -p source
          gdown "${{ steps.req.outputs.id }}" -O source/source.mov
          test -s source/source.mov
          ls -lh source/source.mov

      - name: Build visual observation pack
        shell: bash
        run: |
          mkdir -p observation_output/contact_sheets observation_output/identity/full_context observation_output/identity/anchors observation_output/metadata
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source/source.mov)
          echo "{\"duration_seconds\":$DURATION,\"source_url\":\"${{ steps.req.outputs.url }}\",\"contact_sheet_fps\":3,\"context_interval_seconds\":3}" > observation_output/MANIFEST.json
          cp resolved_request.json observation_output/metadata/request.json
          cp ANALYSIS_PROTOCOL.md observation_output/metadata/ANALYSIS_PROTOCOL.md

          ffmpeg -hide_banner -loglevel warning -y -ss 10 -i source/source.mov -frames:v 1 -q:v 2 observation_output/identity/anchors/anchor_010s.jpg

          ffmpeg -hide_banner -loglevel warning -y -i source/source.mov             -vf "fps=1/3,scale=960:-2,drawtext=text='%{pts\\:hms}':x=12:y=h-th-12:fontsize=28:fontcolor=white:box=1:boxcolor=black@0.65"             -q:v 3 observation_output/identity/full_context/context_%05d.jpg

          ffmpeg -hide_banner -loglevel warning -y -i source/source.mov             -vf "fps=3,scale=480:-2,drawtext=text='%{pts\\:hms}':x=8:y=h-th-8:fontsize=20:fontcolor=white:box=1:boxcolor=black@0.65,tile=4x4:nb_frames=16:padding=2:margin=2"             -q:v 3 observation_output/contact_sheets/sheet_%05d.jpg

      - name: Upload frames artifact
        uses: actions/upload-artifact@v4
        with:
          name: drive-frames-${{ github.run_id }}
          path: observation_output/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
