name: Probe V1.2 Audio
on:
  push:
    branches: [main]
    paths: ['requests/probe-v12-audio.txt']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: |
          python3 -m pip install -q selenium
          python3 - <<'PY'
          import json,time
          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          opts=webdriver.ChromeOptions(); opts.add_argument('--headless=new'); opts.add_argument('--no-sandbox'); opts.add_argument('--disable-dev-shm-usage'); opts.add_argument('--window-size=1440,1200')
          opts.set_capability('goog:loggingPrefs', {'performance':'ALL'})
          d=webdriver.Chrome(options=opts)
          try:
            d.get('https://firestorage.ai/ja/f/7rfLgOWlCDLS')
            b=WebDriverWait(d,25).until(EC.presence_of_element_located((By.XPATH,"//button[contains(., 'ダウンロード') or contains(., 'Download')]")))
            d.execute_script("arguments[0].scrollIntoView({block:'center'}); arguments[0].click();",b)
            time.sleep(8)
            for entry in d.get_log('performance'):
              msg=json.loads(entry['message'])['message']
              if msg['method']!='Network.requestWillBeSent': continue
              u=msg['params']['request']['url']
              if '01a0a2f9c3ec71db9aefea5494513cf3' in u or 'wasabisys.com' in u: print(u)
          finally: d.quit()
          PY
