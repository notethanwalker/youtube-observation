name: Observe YouTube Section

on:
  push:
    branches: [main]
    paths:
      - 'requests/section.json'

permissions:
  contents: read

jobs:
  capture-section:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install portable tools
        shell: powershell
        run: |
          $toolDir = Join-Path $env:RUNNER_TEMP "youtube-section-tools"
          if (Test-Path $toolDir) { Remove-Item $toolDir -Recurse -Force }
          New-Item -ItemType Directory -Path $toolDir | Out-Null

          $yt = Join-Path $toolDir "yt-dlp.exe"
          Invoke-WebRequest -Uri "https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe" -OutFile $yt

          $ffzip = Join-Path $toolDir "ffmpeg.zip"
          Invoke-WebRequest -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" -OutFile $ffzip
          Expand-Archive -Path $ffzip -DestinationPath (Join-Path $toolDir "ffmpeg") -Force
          $ffmpeg = Get-ChildItem (Join-Path $toolDir "ffmpeg") -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $ffmpeg) { throw "ffmpeg.exe not found" }

          "YT_DLP_EXE=$yt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_EXE=$($ffmpeg.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "FFMPEG_DIR=$($ffmpeg.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve request
        id: request
        shell: powershell
        run: |
          $r = Get-Content requests/section.json -Raw | ConvertFrom-Json
          $url = [string]$r.url
          $start = [string]$r.start
          $end = [string]$r.end
          $height = [string]$r.max_height
          if (-not $height) { $height = "720" }
          if (-not ($url -match '^https?://(www\.)?(youtube\.com|youtu\.be)/')) { throw "Unsupported URL" }
          "url=$url" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "start=$start" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "end=$end" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "height=$height" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore optional YouTube cookies
        shell: powershell
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          if ($env:YOUTUBE_COOKIES_B64) {
            $cookiePath = Join-Path $env:RUNNER_TEMP "youtube_cookies.txt"
            [System.IO.File]::WriteAllBytes($cookiePath, [Convert]::FromBase64String($env:YOUTUBE_COOKIES_B64))
            "YOUTUBE_COOKIE_FILE=$cookiePath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Download target section
        id: capture
        shell: powershell
        run: |
          $url = "${{ steps.request.outputs.url }}"
          $start = "${{ steps.request.outputs.start }}"
          $end = "${{ steps.request.outputs.end }}"
          $height = "${{ steps.request.outputs.height }}"
          $out = Join-Path $env:RUNNER_TEMP "new-junk-city-section.mp4"
          if (Test-Path $out) { Remove-Item $out -Force }

          $attempts = @(
            @{ Cookies = $true; Client = $null },
            @{ Cookies = $false; Client = $null },
            @{ Cookies = $false; Client = 'web_safari' },
            @{ Cookies = $false; Client = 'android_vr' }
          )

          $ok = $false
          foreach ($a in $attempts) {
            if (Test-Path $out) { Remove-Item $out -Force }
            $args = @('--no-warnings','--ffmpeg-location',$env:FFMPEG_DIR,'--download-sections',("*" + $start + "-" + $end),'--force-keyframes-at-cuts','-f',("bv*[height<=" + $height + "]+ba/b[height<=" + $height + "]/best"),'--merge-output-format','mp4','-o',$out)
            if ($a.Cookies -and $env:YOUTUBE_COOKIE_FILE) { $args += @('--cookies',$env:YOUTUBE_COOKIE_FILE) }
            if ($a.Client) { $args += @('--extractor-args',('youtube:player_client=' + $a.Client)) }
            $args += $url
            & $env:YT_DLP_EXE @args
            if ($LASTEXITCODE -eq 0 -and (Test-Path $out) -and (Get-Item $out).Length -gt 0) { $ok = $true; break }
          }
          if (-not $ok) { throw "All section download attempts failed" }
          "SECTION_FILE=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Upload section artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-junk-city-section-${{ github.run_id }}
          path: ${{ env.SECTION_FILE }}
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

      - name: Cleanup
        if: always()
        shell: powershell
        run: |
          if ($env:YOUTUBE_COOKIE_FILE) { Remove-Item $env:YOUTUBE_COOKIE_FILE -Force -ErrorAction SilentlyContinue }
          if ($env:SECTION_FILE) { Remove-Item $env:SECTION_FILE -Force -ErrorAction SilentlyContinue }
