name: Capitology Pass 6 Home Media Probe

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/capitology-pass6-home-probe.yml'
      - 'requests/capitology-pass6-home-probe.json'

permissions:
  contents: read

jobs:
  probe:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve one small visual sample
        shell: powershell
        env:
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
        run: |
          $request = Get-Content requests/capitology-pass6-home-probe.json -Raw | ConvertFrom-Json
          $videoId = [string]$request.video_id
          $start = [int]$request.start_seconds
          $duration = [int]$request.duration_seconds
          if ($videoId -notmatch '^[A-Za-z0-9_-]{11}$' -or $start -lt 0 -or $duration -lt 1 -or $duration -gt 30) {
            throw 'Invalid bounded request'
          }
          $url = 'https://www.youtube.com/watch?v=' + $videoId
          $end = $start + $duration
          $output = Join-Path $PWD 'probe_output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          $yt = Join-Path $env:RUNNER_TEMP 'capitology-pass6-yt-dlp.exe'
          Invoke-WebRequest -Uri 'https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe' -OutFile $yt
          $runnerRoot = Split-Path (Split-Path $env:RUNNER_TEMP -Parent) -Parent
          $node = Join-Path $runnerRoot 'externals\node24\bin\node.exe'
          if (-not (Test-Path $node)) { $node = Join-Path $runnerRoot 'externals\node20\bin\node.exe' }
          if (-not (Test-Path $node)) { throw 'No runner Node executable found for the YouTube player challenge' }
          $jsArgs = @('--js-runtimes', ('node:' + $node), '--remote-components', 'ejs:github', '--no-cache-dir')
          $cookieArgs = @()
          if ($env:YOUTUBE_COOKIES_B64) {
            $cookiePath = Join-Path $env:RUNNER_TEMP 'capitology-pass6-cookies.txt'
            [System.IO.File]::WriteAllBytes($cookiePath, [Convert]::FromBase64String($env:YOUTUBE_COOKIES_B64))
            $cookieArgs = @('--cookies', $cookiePath)
          }
          try {
            $storyboard = Join-Path $output 'storyboard.%(ext)s'
            $storyboardOk = $false
            $activeCookies = @()
            foreach ($mode in @('anonymous', 'cookies')) {
              if ($mode -eq 'cookies' -and $cookieArgs.Count -eq 0) { continue }
              $activeCookies = @()
              if ($mode -eq 'cookies') { $activeCookies = $cookieArgs }
              Write-Host ('Storyboard attempt: ' + $mode)
              & $yt @jsArgs --no-playlist --no-progress @activeCookies -f sb0 -o $storyboard $url
              $storyboardOk = ($LASTEXITCODE -eq 0) -and ((Get-ChildItem $output -Filter '*.mhtml' | Measure-Object).Count -gt 0)
              if ($storyboardOk) { break }
            }
            $clipOk = $false
            if (Get-Command ffmpeg.exe -ErrorAction SilentlyContinue) {
              $clip = Join-Path $output 'section.mp4'
              & $yt @jsArgs --no-playlist --no-progress @activeCookies -f 'bv*[height<=480]/b[height<=480]/best[height<=480]' --download-sections "*$start-$end" --merge-output-format mp4 --force-overwrites -o $clip $url
              $clipOk = ($LASTEXITCODE -eq 0) -and (Test-Path $clip) -and ((Get-Item $clip).Length -gt 0)
            }
            $manifest = @{video_id=$videoId; start_seconds=$start; end_seconds=$end; storyboard=$storyboardOk; clip=$clipOk}
            $manifest | ConvertTo-Json | Out-File (Join-Path $output 'manifest.json') -Encoding utf8
            if (-not $storyboardOk -and -not $clipOk) { throw 'Neither storyboard nor clip was retrieved' }
            Write-Host ('Storyboard: ' + $storyboardOk + '; clip: ' + $clipOk)
          } finally {
            if ($cookiePath -and (Test-Path $cookiePath)) { Remove-Item $cookiePath -Force }
          }
      - name: Upload probe artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capitology-pass6-home-probe-${{ github.run_id }}
          path: probe_output/
          retention-days: 1
          if-no-files-found: warn
          compression-level: 0
