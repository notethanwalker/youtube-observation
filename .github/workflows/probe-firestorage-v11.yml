name: Probe V1.1 Share
on:
  push:
    branches: [main]
    paths: ['requests/probe-v11-share.txt']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          curl -sS -D /tmp/headers 'https://api.firestorage.ai/dev/file/shares/8LrW-NVUGC2d/files?maxResults=1000' -o /tmp/body
          cat /tmp/headers
          cat /tmp/body
